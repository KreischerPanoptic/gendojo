# =============================================================================
# GenDojo — docker-compose
#
# Локальная разработка:
#   docker compose up
#
# С GPU (если есть nvidia-container-toolkit):
#   docker compose --profile gpu up
#
# Только для сборки и проверки без GPU:
#   docker compose up gendojo-cpu
# =============================================================================

name: gendojo

services:

  # ---------------------------------------------------------------------------
  # Production-like (с GPU) — основной сервис
  # ---------------------------------------------------------------------------
  gendojo:
    build:
      context: .
      dockerfile: Dockerfile
    image: gendojo:latest
    container_name: gendojo
    profiles: [gpu]
    runtime: nvidia
    environment:
      NODE_ENV: production

      # Пути к данным — /workspace/* как на RunPod
      MODELS_PATH: /workspace/models
      DATASETS_PATH: /workspace/datasets
      OUTPUTS_PATH: /workspace/outputs
      LOGS_PATH: /workspace/logs
      TEMP_PATH: /workspace/temp

      # sd-scripts и accelerate
      SD_SCRIPTS_PATH: /app/sd-scripts
      ACCELERATE_CONFIG_PATH: /app/config_files/accelerate/runpod.yaml

      # Настройки GenDojo
      SETTINGS_PATH: /workspace/gendojo/settings.json
      MAX_CONCURRENT_JOBS: 1
      LOG_BUFFER_SIZE: 1000
      NUM_CPU_THREADS_PER_PROCESS: 2

      # JWT — обязательно поменять в продакшне
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}

      # HuggingFace / CivitAI (опционально)
      HF_TOKEN: ${HF_TOKEN:-}
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}

    ports:
      - "3000:3000"

    volumes:
      # Данные — персистентные
      - ./models:/workspace/models
      - ./datasets:/workspace/datasets
      - ./outputs:/workspace/outputs
      - ./logs:/workspace/logs
      - gendojo-settings:/workspace/gendojo

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # CPU-only — для разработки / CI без GPU
  # ---------------------------------------------------------------------------
  gendojo-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: gendojo:latest
    container_name: gendojo-cpu
    profiles: [cpu, default]
    environment:
      NODE_ENV: production
      MODELS_PATH: /workspace/models
      DATASETS_PATH: /workspace/datasets
      OUTPUTS_PATH: /workspace/outputs
      LOGS_PATH: /workspace/logs
      TEMP_PATH: /workspace/temp
      SD_SCRIPTS_PATH: /app/sd-scripts
      ACCELERATE_CONFIG_PATH: /app/config_files/accelerate/runpod.yaml
      SETTINGS_PATH: /workspace/gendojo/settings.json
      MAX_CONCURRENT_JOBS: 1
      LOG_BUFFER_SIZE: 1000
      NUM_CPU_THREADS_PER_PROCESS: 2
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      HF_TOKEN: ${HF_TOKEN:-}
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}

    ports:
      - "3000:3000"

    volumes:
      - ./models:/workspace/models
      - ./datasets:/workspace/datasets
      - ./outputs:/workspace/outputs
      - ./logs:/workspace/logs
      - gendojo-settings:/workspace/gendojo

    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  gendojo-settings:
    driver: local