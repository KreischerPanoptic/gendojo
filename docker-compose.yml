name: gendojo

services:
  gendojo:
    image: dnissoroka/gendojo:latest
    container_name: gendojo
    ports:
      - "3000:3000"
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - gendojo-settings:/app/gendojo
    environment:
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      HF_TOKEN: ${HF_TOKEN:-}
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}
    restart: unless-stopped

  gendojo-gpu:
    image: dnissoroka/gendojo:latest
    container_name: gendojo-gpu
    profiles: [gpu]
    runtime: nvidia
    ports:
      - "3000:3000"
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - gendojo-settings:/app/gendojo
    environment:
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      HF_TOKEN: ${HF_TOKEN:-}
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  gendojo-settings: